name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - run: mkdocs build --config-file docs/mkdocs.yml --strict

      # No GitHub-Pages-equivalent managed deploy action on Forgejo/Gitea
      # (actions/upload-pages-artifact + actions/deploy-pages use GitHub's
      # own OIDC Pages deployment API) -- pushes the built site to a
      # `pages` branch via plain git instead. Whether/how this instance
      # serves that branch as a website (Forgejo Pages, a separately
      # configured static host, or not at all) is instance-specific and
      # not asserted here.
      - name: Deploy to Pages branch
        run: |
          set -euo pipefail
          AUTH_URL="${GITHUB_SERVER_URL/#https:\/\//https:\/\/x-access-token:${{ secrets.GITHUB_TOKEN }}@}/${GITHUB_REPOSITORY}.git"
          cd site
          git init -q -b pages
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.localhost"
          git add -A
          git commit -q -m "docs: deploy ${GITHUB_SHA}"
          git push --force "${AUTH_URL}" HEAD:pages
