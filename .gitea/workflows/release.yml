name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured — skipping signed build steps that require it." >&2
          fi

      - name: Build release App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release APK (for smoke-testing / direct distribution)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk

      # softprops/action-gh-release is hardcoded to GitHub's Releases API --
      # replaced with direct calls to the Forgejo/Gitea Releases REST API
      # (stable, documented, same shape on both since Forgejo is a Gitea
      # fork): create the release, then upload each build artifact as a
      # release asset.
      - name: Create Forgejo/Gitea Release
        run: |
          set -euo pipefail
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"

          RELEASE_JSON=$(curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg tag "$TAG" --arg name "$TAG" '{tag_name: $tag, name: $name, draft: false, prerelease: false}')" \
            "${API}/releases")
          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "::error::Failed to create release: ${RELEASE_JSON}"
            exit 1
          fi

          for asset in android/app/build/outputs/bundle/release/*.aab android/app/build/outputs/apk/release/*.apk; do
            [ -f "$asset" ] || continue
            curl -sS -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -F "attachment=@${asset}" \
              "${API}/releases/${RELEASE_ID}/assets?name=$(basename "$asset")"
          done

      # Optional: upload straight to Google Play via fastlane supply.
      # Requires a Play Console service-account JSON stored as the
      # PLAY_STORE_SERVICE_ACCOUNT_JSON secret. Uncomment once configured.
      # - name: Set up fastlane
      #   run: |
      #     gem install bundler
      #     bundle install
      # - name: Upload to Play Store (internal track)
      #   env:
      #     SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      #   run: |
      #     bundle exec fastlane supply \
      #       --aab app/build/outputs/bundle/release/app-release.aab \
      #       --track internal \
      #       --package_name com.acfharbinger.mobilefortress

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore

  # iOS release (App Store Connect signing/export) is not automated yet --
  # see moon/roadmaps/ios.md. `just ios-archive` produces an unsigned
  # .xcarchive locally on a macOS host as a starting point.
