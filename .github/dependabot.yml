version: 2
updates:
  # Kotlin/Gradle dependencies (android/ root + app module)
  # No "swift" (Swift Package Manager) entry: ios/MyGame.xcodeproj has zero
  # external SPM dependencies today, so Dependabot's swift ecosystem (which
  # requires a Package.swift/Package.resolved to scan) has nothing to do.
  # Add one under directory "/ios" once the iOS app takes on an SPM package.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Node/npm — root package.json's npm workspaces cover docs/website
  # (the documentation site + interactive design hub) and any future JS/TS
  # package added to "workspaces".
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker (optional backend)
  - package-ecosystem: "docker"
    directory: "/infra/global/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"

  # Terraform providers/modules (optional backend)
  - package-ecosystem: "terraform"
    directory: "/infra/global/terraform"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "infra"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
