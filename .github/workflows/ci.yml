name: CI

# Legacy-template workflow. The Android (android/, gradle/) and iOS (ios/)
# trees are inherited template scaffolding, not the live Godot 4 + C++ product
# under game/ (see docs/moon/ROADMAP.md "Template Scaffolding"). The legacy
# jobs are gated per tree by the `changes` job so work on the live product is
# not blocked by pre-existing breakage in the legacy trees; each legacy job
# still runs whenever its own tree (or this workflow) changes.
#
# Recorded findings (2026-10-08):
#   * (T50) gradle/wrapper/gradle-wrapper.jar was a non-official build and
#     failed gradle/actions wrapper validation. Regenerated with Gradle 8.7's
#     own `wrapper` task; sha256 now matches the official 8.7 checksum
#     (cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8).
#   * (T63, superseded by T71) The catalog had pinned AGP 9.3.1 against the
#     Gradle 8.7 wrapper; T63 reverted it. T71 then moved the whole toolchain
#     forward as one set: wrapper 9.7.0 (official checksum
#     7a9ce74c...62c5d) + AGP 9.3.1 + Kotlin 2.4.10 + ktlint-gradle 14.2.0 +
#     androidx bumps, compileSdk 37, targetSdk deliberately 35. AGP 9 embeds
#     Kotlin support, so org.jetbrains.kotlin.android is no longer applied.
#     Verified locally under JDK 21 (which the Android jobs here use):
#     ktlintCheck / testDebugUnitTest (3/3) / lintDebug / assembleDebug all
#     green. Dependabot groups keep coupled bumps together.
#   * (open) ios/MyGame.xcodeproj fails to parse on the macos-latest runner
#     under Xcode 26.6 ("project is damaged ... parse error"), although the
#     pbxproj passes static structure checks (no conflict markers, no dangling
#     UUID refs, valid OpenStep plist, no BOM/CRLF, balanced braces, no
#     duplicate keys, no non-ASCII bytes). Needs a macOS host to root-cause;
#     the tree is not built or run anywhere else.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "game/**"
      - "gradle/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "justfile"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "ios/**"
      - "game/**"
      - "gradle/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "justfile"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-tree path gate for the legacy jobs below. `android=true` when the
  # Android build inputs (or this workflow file) changed; `ios=true` likewise.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.trees.outputs.android }}
      ios: ${{ steps.trees.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed path trees
        id: trees
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              echo "android=true" >> "$GITHUB_OUTPUT"
              echo "ios=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            push)
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
              ;;
            pull_request)
              range="${PR_BASE}..${PR_HEAD}"
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if ! changed="$(git diff --name-only "$range")"; then
            # An unavailable base must not hide earlier tree changes.
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed paths:\n%s\n' "$changed"
          android=false
          ios=false
          while IFS= read -r path; do
            case "$path" in
              android/*|gradle/*|build.gradle.kts|settings.gradle.kts|justfile|.github/workflows/ci.yml)
                android=true ;;
            esac
            case "$path" in
              ios/*|.github/workflows/ci.yml)
                ios=true ;;
            esac
          done <<< "$changed"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck scripts/*.sh
        # Keep scripts/*.sh lint-clean; pinned by digest to the version used
        # for local verification (koalaman/shellcheck 0.11.0 via Docker).
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d scripts/*.sh

  android-lint-and-unit-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/

      - uses: codecov/codecov-action@v7
        with:
          files: android/app/build/reports/jacoco/**/*.xml
          fail_ci_if_error: false

  android-build-debug:
    runs-on: ubuntu-latest
    needs: [changes, android-lint-and-unit-test]
    if: needs.changes.outputs.android == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk

  android-instrumented-tests:
    runs-on: ubuntu-latest
    needs: [changes, android-lint-and-unit-test]
    if: needs.changes.outputs.android == 'true'
    strategy:
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest

  ios-test:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run XCTest suite
        run: |
          xcodebuild -project ios/MyGame.xcodeproj -scheme MyGame \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            test
