name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/website/vue/package-lock.json

      - name: Install dependencies
        working-directory: docs/website/vue
        run: npm ci

      # docs/website/vue is a Vite + Vue 3 + TypeScript SPA: every
      # docs/**/*.md (plus the curated repo-wide guides in
      # scripts/generate-nav.mjs's EXTRA_SECTIONS) is bundled at build time
      # via import.meta.glob — no separate runtime content mirror needed.
      # SITE_BASE matches the GitHub Pages project-site subpath so built
      # asset URLs (and the 404.html deep-link redirect) resolve correctly.
      - name: Type-check + build
        working-directory: docs/website/vue
        run: npm run build
        env:
          SITE_BASE: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/website/vue/dist
          publish_branch: gh-pages
