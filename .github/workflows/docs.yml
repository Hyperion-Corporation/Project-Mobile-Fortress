name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/website is a static Vue 3 SPA (CDN build, no bundler/npm step)
      # that fetches its documentation pages as raw markdown at runtime.
      # Assemble the publish artifact: the app itself at the root, plus a
      # content/ mirror of every docs/**/*.md source file (excluding the
      # app's own docs/website/) for it to fetch.
      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf gh-pages-out
          mkdir -p gh-pages-out gh-pages-out/content
          cp -r docs/website/. gh-pages-out/
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.md' --exclude='website/**' --exclude='*' \
            docs/ gh-pages-out/content/
          touch gh-pages-out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-out
          publish_branch: gh-pages
