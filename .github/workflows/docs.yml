name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/website is a static Vue 3 SPA (CDN build, no bundler/npm step)
      # that fetches its documentation pages as raw markdown at runtime.
      # Assemble the publish artifact: the app itself at the root, plus a
      # content/ mirror of the repository's tracked Markdown documentation
      # (excluding the app itself) for it to fetch without losing the source
      # paths used by relative links.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p gh-pages-out gh-pages-out/content
          cp -r docs/website/. gh-pages-out/
          while IFS= read -r -d '' source; do
            case "$source" in
              docs/website/*) continue ;;
            esac
            install -D "$source" "gh-pages-out/content/$source"
          done < <(git ls-files -z '*.md')
          touch gh-pages-out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-out
          publish_branch: gh-pages
