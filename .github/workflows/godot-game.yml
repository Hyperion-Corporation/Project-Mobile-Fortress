name: Godot game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/godot-game.yml"
  pull_request:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/godot-game.yml"

concurrency:
  group: godot-game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake-native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: game/build/_deps
          key: mf-game-deps-${{ runner.os }}-${{ hashFiles('game/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S game -B game/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build game/build --target sim_world_tests -j

      - name: ctest
        run: ctest --test-dir game/build --output-on-failure

  godot-simulation-smoke:
    runs-on: ubuntu-latest
    needs: cmake-native-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git unzip

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: game/build/_deps
          key: mf-game-deps-${{ runner.os }}-${{ hashFiles('game/CMakeLists.txt') }}

      - name: Configure and build extension
        run: |
          cmake -S game -B game/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build game/build --target mobile_fortress_core -j
          mkdir -p game/bin
          cp -f game/build/libmobile_fortress_core.so game/bin/libmobile_fortress_core.so
          cp -f game/build/libmobile_fortress_core.so game/bin/libmobile_fortress_core.linux.x86_64.so

      - name: Install Godot 4.7.1
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
        run: |
          curl -fsSL -o /tmp/godot.zip "$GODOT_URL"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: SimulationCore headless smoke
        run: |
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --path game --headless --script res://tests/simulation_smoke.gd
