<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Fortress - Interactive Development Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏯</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- KaTeX (math rendering for design-doc formulas) -->
    <link rel="stylesheet" href="https://unpkg.com/katex@0.16.9/dist/katex.min.css">

    <!-- Main Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
    <div id="app"></div>

    <!-- ============================================================ -->
    <!-- Vue templates (no-build setup: templates live as plain HTML  -->
    <!-- <script type="text/x-template"> blocks, referenced by id     -->
    <!-- from the component definitions in app.js).                  -->
    <!-- ============================================================ -->

    <script type="text/x-template" id="tpl-app">
        <blossoms-canvas></blossoms-canvas>
        <nav-bar></nav-bar>
        <router-view v-slot="{ Component, route }">
            <transition name="fade" mode="out-in">
                <component :is="Component" :key="route.path"></component>
            </transition>
        </router-view>
        <site-footer></site-footer>
    </script>

    <script type="text/x-template" id="tpl-blossoms-canvas">
        <canvas id="blossoms-canvas" ref="canvas"></canvas>
    </script>

    <script type="text/x-template" id="tpl-nav-bar">
        <header class="navbar">
            <router-link to="/" class="logo">
                <span class="fortress-title">MOBILE FORTRESS</span>
                <span class="era-tag">嘉靖倭寇 1540s–1560s</span>
            </router-link>
            <nav class="nav-links">
                <a href="#" v-for="t in tabs" :key="t.id"
                   :class="{ active: isHomeTabActive(t.id) }"
                   @click.prevent="goToTab(t.id)">{{ t.nav }}</a>
                <router-link to="/docs/index" :class="{ active: isDocsActive }">Documentation</router-link>
            </nav>
        </header>
    </script>

    <script type="text/x-template" id="tpl-site-footer">
        <footer class="footer">
            <p>&copy; 2026 ACFHarbinger. Project Mobile Fortress. All Rights Reserved.</p>
            <p class="sub-footer">Authoritative Codebase Reference: <a href="https://github.com/ACFHarbinger/Project-Mobile-Fortress/blob/main/.agent/AGENTS.md" class="footer-link" target="_blank" rel="noopener">AGENTS.md</a></p>
        </footer>
    </script>

    <!-- ================= Home view ================= -->
    <script type="text/x-template" id="tpl-home-view">
        <main>
            <section class="hero-section">
                <div class="hero-overlay"></div>
                <div class="hero-content">
                    <div class="badge">DEVELOPMENT CONSOLE V3.0</div>
                    <h1>Defend the Coastal Fortress</h1>
                    <p class="hero-desc">
                        A 1540s–1560s Wokou-era Cooperative Tower Defense &amp; 4X Strategy Game — an East Asian
                        coastal power and its Western trading-partner allies combine traditional Ukiyo-e-influenced
                        aesthetics with headless Rust core simulation, Dijkstra vector pathfinding, and machine
                        learning difficulty adjustment to repel pirate raiders by land and sea.
                    </p>
                    <div class="hero-actions">
                        <a href="#design-hub" class="btn btn-primary" @click.prevent="goToTab('design')">Try Design Simulators</a>
                        <router-link to="/docs/design/game_design_document" class="btn btn-secondary">Read GDD Spec</router-link>
                    </div>
                </div>
                <div class="hero-image-container">
                    <img src="assets/mobile_fortress_banner.jpg" alt="Wokou Raid: Night on the China Coast" class="hero-banner-img">
                </div>
            </section>

            <div class="container">
                <section class="gdd-tabs-section" id="design-hub">
                    <div class="tabs-header">
                        <button v-for="t in tabs" :key="t.id" class="tab-btn"
                                :class="{ active: homeState.tab === t.id }"
                                @click="homeState.tab = t.id">
                            <span class="icon">{{ t.icon }}</span> {{ t.label }}
                        </button>
                    </div>

                    <div class="tabs-content">
                        <keep-alive>
                            <component :is="activePanel"></component>
                        </keep-alive>
                    </div>
                </section>

                <section class="roadmap-section" id="roadmap">
                    <h2 class="section-title">Mobile Fortress Roadmap</h2>
                    <div class="timeline">
                        <div class="timeline-item" v-for="(phase, idx) in phases" :key="idx">
                            <div class="timeline-badge">{{ idx + 1 }}</div>
                            <div class="timeline-panel glass panel">
                                <h3>{{ phase.title }}</h3>
                                <span class="timeline-date">{{ phase.date }}</span>
                                <p>{{ phase.desc }}</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </script>

    <!-- ---- Design Hub tab: Flow Field simulator ---- -->
    <script type="text/x-template" id="tpl-design-panel">
        <div class="tab-pane active" id="tab-design">
            <div class="grid-3-col">
                <div class="panel glass col-span-1">
                    <h2>Wokou-Era Coastal Defense &amp; Unit Class Design</h2>
                    <p>
                        <strong>Mobile Fortress</strong> merges cooperative 2D tower defense combat with a
                        persistent 4X coastal territory map. Players deploy garrison spearmen, Fo-lang-ji cannon
                        crews, Portuguese arquebusiers, war junks, and veteran commanders to repel Wokou pirate
                        raiders by land and sea.
                    </p>
                    <p>
                        <strong>Flow Field Pathfinding</strong>: Recalculates cost vectors for all units
                        simultaneously, bypassing standard pathfinding bottlenecks.
                    </p>
                    <div class="control-group">
                        <label>Brush Tool:</label>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-tool" :class="{ active: tool === 'wall' }" @click="tool = 'wall'">🧱 Place Barricade</button>
                            <button class="btn btn-sm btn-tool" :class="{ active: tool === 'swamp' }" @click="tool = 'swamp'">🌾 Slow Swamp (Cost: 3)</button>
                            <button class="btn btn-sm btn-tool" :class="{ active: tool === 'clear' }" @click="tool = 'clear'">🧹 Clear Tile</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <button class="btn btn-primary btn-block" @click="spawnEnemies">⚔️ Spawn Wokou Raid Wave</button>
                        <button class="btn btn-secondary btn-block" @click="resetGrid">🔄 Reset Grid</button>
                    </div>
                </div>

                <div class="panel glass col-span-2 flex-center">
                    <div class="grid-simulator-container">
                        <div class="legend-bar">
                            <span>⛩️ Spawn</span>
                            <span>🏰 HQ (Goal)</span>
                            <span>🧱 Barricade</span>
                            <span>🌾 Swamp</span>
                        </div>
                        <div class="simulator-grid" ref="gridEl">
                            <div v-for="cell in grid" :key="cell.row + '-' + cell.col"
                                 class="grid-cell"
                                 :class="cellClass(cell)"
                                 @mousedown="handleCellClick(cell)">
                                <span v-if="cell.arrow" class="cell-arrow">{{ cell.arrow }}</span>
                            </div>
                            <div v-for="e in enemies" :key="e.id" class="enemy-dot"
                                 :style="{ left: (e.c * cellWidth + cellWidth / 2) + 'px', top: (e.r * cellWidth + cellWidth / 2) + 'px' }"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- ---- Design Hub tab: Technical blueprint (Genetic Algorithm) ---- -->
    <script type="text/x-template" id="tpl-tech-panel">
        <div class="tab-pane active" id="tab-tech">
            <div class="grid-2-col">
                <div class="panel glass">
                    <h2>Headless Rust Core &amp; FFI Architecture</h2>
                    <p>
                        The simulation engine is isolated within a headless Rust core compiled with FFI bindings
                        using <strong>UniFFI</strong>.
                    </p>
                    <ul>
                        <li><strong>`hecs` ECS Engine</strong>: contiguously packages components to maximize memory cache hits on mobile processors.</li>
                        <li><strong>`rkyv` Serialization</strong>: generates zero-copy state buffers, bypassing dynamic language parsing overhead.</li>
                    </ul>

                    <h3 style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Evolve Wall Placements</h3>
                    <p class="panel-desc">
                        The game runs a Genetic Algorithm (GA) to evolve wall layouts that maximize path length to the HQ within budget limits.
                    </p>
                    <div class="panel-dark ga-controls-box" style="margin-top: 1rem;">
                        <div class="stat-row"><span>Generation:</span> <strong>{{ gen }}</strong></div>
                        <div class="stat-row"><span>Best Fitness (Path Length):</span> <strong>{{ bestFitness }}</strong></div>
                        <div class="stat-row"><span>Average Fitness:</span> <strong>{{ avgFitness.toFixed(1) }}</strong></div>
                        <div class="btn-row" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                            <button class="btn btn-sm btn-primary" @click="runGeneration">🧬 Evolve Gen</button>
                            <button class="btn btn-sm btn-secondary" @click="reset">🔄 Reset GA</button>
                        </div>
                    </div>
                </div>

                <div class="panel glass flex-center">
                    <h3>Genetic Algorithm Maze Grid</h3>
                    <p class="panel-desc" style="margin-bottom: 1rem;">Evolved wall blockages (red) maximize winding pathways (gold) from the spawn (blue) to the HQ (purple).</p>
                    <div class="ga-grid-container" style="display: flex; justify-content: center;">
                        <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 320px; height: 320px; background: rgba(0,0,0,0.3); border: 2px solid var(--border-color); border-radius: 4px; padding: 2px;">
                            <div v-for="cell in grid" :key="cell.row + '-' + cell.col" class="ga-cell" :class="gaCellClass(cell)">{{ gaCellIcon(cell) }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- ---- Design Hub tab: Acoustic design ---- -->
    <script type="text/x-template" id="tpl-audio-panel">
        <div class="tab-pane active" id="tab-audio">
            <div class="grid-2-col">
                <div class="panel glass">
                    <h2>Dynamic Taiko Percussion &amp; Ambience</h2>
                    <p>
                        Ambient nature sounds and high-energy Taiko drums scale dynamically. The audio layers adjust
                        using a centralized <strong>Excitement Scale</strong> ($E$) computed by the game loop:
                    </p>
                    <p class="math-formula">
                        $$E = w_1 \cdot \text{EnemiesOnScreen} + w_2 \cdot \text{HQHealthLoss} + w_3 \cdot \text{BossPresence}$$
                    </p>
                    <div class="panel-dark profile-panel" style="margin-top: 1rem;">
                        <h4>Pitch Excitement Modulators</h4>
                        <div class="slider-group">
                            <label>Active Enemies on Screen: <span>{{ enemyCount }}</span></label>
                            <input type="range" min="0" max="60" v-model.number="enemyCount" class="slider">
                        </div>
                        <div class="slider-group">
                            <label>Fortress HQ Health Loss: <span>{{ healthLoss }}%</span></label>
                            <input type="range" min="0" max="100" v-model.number="healthLoss" class="slider">
                        </div>
                        <div class="slider-group">
                            <label>On-Pitch Boss Presence: <span>{{ bossText }}</span></label>
                            <input type="range" min="0" max="2" v-model.number="boss" class="slider">
                        </div>
                    </div>
                </div>

                <div class="panel glass flex-center">
                    <h3>MetaSound Excitement Waveform</h3>
                    <div class="audio-visualization-box panel-dark">
                        <div class="wave-visualizer-container">
                            <div class="audio-wave">
                                <div v-for="(h, i) in waveHeights" :key="i" class="wave-bar" :class="activeClass" :style="{ height: h + 'px' }"></div>
                            </div>
                        </div>
                        <div class="stat-row" style="margin-top: 1rem;">
                            <span>Atmosphere State:</span> <strong class="highlight">{{ state }}</strong>
                        </div>
                        <div class="stat-row">
                            <span>Calculated Excitement ($E$):</span> <strong>{{ excitement.toFixed(2) }}</strong>
                        </div>
                        <div class="ai-speech" style="margin-top: 1rem;">
                            <strong>Active Audio Track:</strong>
                            <p>{{ desc }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- ---- Design Hub tab: Production roadmap ---- -->
    <script type="text/x-template" id="tpl-production-panel">
        <div class="tab-pane active" id="tab-production">
            <div class="panel glass">
                <h2>Development Sprints &amp; Technical Pipelines</h2>
                <p class="panel-desc" style="margin-bottom: 2rem;">Click on any sprint milestone below to view deliverables, active checklists, and technical dependencies.</p>

                <div class="sprints-interactive-grid">
                    <div class="sprint-header-buttons">
                        <button v-for="(s, id) in sprints" :key="id" class="sprint-nav-btn"
                                :class="{ active: selected == id }" @click="selected = id">{{ s.title }}</button>
                    </div>

                    <transition name="fade" mode="out-in">
                        <div class="sprint-display-panel panel-dark" :key="selected">
                            <h4 style="color: var(--accent-gold); margin-bottom: 0.3rem;">{{ current.title }}</h4>
                            <span style="font-size: 0.8rem; color: var(--accent-green, #4caf50); font-weight: bold; display: block; margin-bottom: 0.8rem;">{{ current.timeline }}</span>
                            <strong style="font-size: 0.85rem; color: var(--text-primary);">Sprint Deliverables Checklist:</strong>
                            <ul class="roadmap-list">
                                <li v-for="(g, i) in current.goals" :key="i">{{ g }}</li>
                            </ul>
                            <div style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.8rem; font-size: 0.8rem; color: var(--text-muted);">
                                <strong>Technical Dependencies:</strong> {{ current.deps }}
                            </div>
                        </div>
                    </transition>
                </div>
            </div>
        </div>
    </script>

    <!-- ---- Design Hub tab: QA suite ---- -->
    <script type="text/x-template" id="tpl-qa-panel">
        <div class="tab-pane active" id="tab-qa">
            <div class="grid-2-col">
                <div class="panel glass">
                    <h2>Automated Headless Audits &amp; Diagnostics</h2>
                    <p>
                        Headless Rust simulation passes run stress tests checking for Behavior Tree coordinate drifts, FFI boundary leakages, and network sync bounds.
                    </p>
                    <div class="panel-dark profile-panel" style="margin-top: 1.5rem;">
                        <h4>Network Latency Profiler</h4>
                        <div class="slider-group">
                            <label>Simulated Latency (Ping): <span>{{ ping }}ms</span></label>
                            <input type="range" min="10" max="300" v-model.number="ping" class="slider">
                        </div>
                        <div class="slider-group">
                            <label>Packet Loss Ratio: <span>{{ loss.toFixed(1) }}%</span></label>
                            <input type="range" min="0" max="100" v-model.number="loss" class="slider">
                        </div>
                        <div class="slider-group">
                            <label>Jitter (ms): <span>{{ jitter }}ms</span></label>
                            <input type="range" min="0" max="50" v-model.number="jitter" class="slider">
                        </div>
                    </div>
                </div>

                <div class="panel glass flex-center">
                    <h3>Replication Parity Dashboard</h3>
                    <div class="qa-status-box">
                        <div class="alert-banner" :class="{ warning: desynced }">
                            <span>{{ desynced ? '⚠️ REPLICATION DESYNC DETECTED' : '🟢 REPLICATION SYNCHRONIZED' }}</span>
                        </div>
                        <div class="stat-row" style="margin-top: 1rem;">
                            <span>Sync State:</span> <strong>{{ desynced ? 'Replication Drift' : 'Perfect Parity' }}</strong>
                        </div>
                        <div class="stat-row">
                            <span>State Coordinates Drift:</span>
                            <strong class="highlight" :style="{ color: desynced ? 'var(--accent-crimson)' : 'var(--accent-gold)' }">{{ drift.toFixed(1) }} units</strong>
                        </div>
                        <div class="panel-dark" style="margin-top: 1rem; font-family: monospace; font-size: 0.75rem; height: 100px; overflow-y: auto;">
                            <div v-for="(l, i) in logs" :key="i">{{ l }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- ================= Documentation view ================= -->
    <script type="text/x-template" id="tpl-docs-view">
        <div class="docs-shell">
            <button class="docs-sidebar-toggle" @click="sidebarOpen = !sidebarOpen">☰ Contents</button>
            <aside class="docs-sidebar" :class="{ open: sidebarOpen }">
                <input class="docs-search" type="search" v-model="query" placeholder="Filter pages…">
                <nav>
                    <div v-for="section in filteredSections" :key="section.title" class="docs-nav-section">
                        <h4>{{ section.title }}</h4>
                        <router-link v-for="item in section.items" :key="item.slug"
                                     :to="'/docs/' + item.slug"
                                     class="docs-nav-link"
                                     :class="{ active: item.slug === slug }"
                                     @click="sidebarOpen = false">{{ item.title }}</router-link>
                    </div>
                </nav>
            </aside>

            <div class="docs-main">
                <div class="docs-toolbar">
                    <span class="docs-breadcrumb">{{ breadcrumb }}</span>
                    <a class="docs-edit-link" :href="editUrl" target="_blank" rel="noopener">Edit on GitHub ↗</a>
                </div>

                <div v-if="loading" class="docs-state">Loading…</div>
                <div v-else-if="error" class="docs-state docs-error">
                    <h2>Page not found</h2>
                    <p>No documentation page at <code>{{ slug }}</code>.</p>
                    <router-link to="/docs/index" class="btn btn-secondary btn-sm">Back to documentation home</router-link>
                </div>
                <template v-else>
                    <article class="docs-content" ref="contentEl" @click="onContentClick" v-html="content"></article>

                    <nav class="docs-prev-next">
                        <router-link v-if="prevDoc" :to="'/docs/' + prevDoc.slug" class="docs-prev-next-link prev">
                            <span>← Previous</span>{{ prevDoc.title }}
                        </router-link>
                        <span v-else></span>
                        <router-link v-if="nextDoc" :to="'/docs/' + nextDoc.slug" class="docs-prev-next-link next">
                            <span>Next →</span>{{ nextDoc.title }}
                        </router-link>
                    </nav>
                </template>
            </div>

            <aside class="docs-toc" v-if="headings.length">
                <h4>On this page</h4>
                <a v-for="h in headings" :key="h.id" :href="'#' + h.id" class="docs-toc-link" :class="'level-' + h.level"
                   @click.prevent="scrollToHeading(h.id)">{{ h.text }}</a>
            </aside>
        </div>
    </script>

    <script type="text/x-template" id="tpl-not-found">
        <div class="container" style="padding-top: 10rem; text-align: center;">
            <h1>404</h1>
            <p class="hero-desc">This page doesn't exist — perhaps it was lost to a Wōkòu raid.</p>
            <router-link to="/" class="btn btn-primary">Return to base</router-link>
        </div>
    </script>

    <!-- Vue 3 + Vue Router 4 (global/UMD builds, no build step) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <!-- Markdown rendering -->
    <script src="https://unpkg.com/marked@18/lib/marked.umd.js"></script>
    <script src="https://unpkg.com/dompurify@3/dist/purify.min.js"></script>
    <!-- Diagrams -->
    <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Math -->
    <script src="https://unpkg.com/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://unpkg.com/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- App -->
    <script src="app.js"></script>
</body>
</html>
