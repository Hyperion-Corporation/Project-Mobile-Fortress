<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storybook — Mobile Fortress</title>
    <!--
      Committed fallback: if `npm run build-storybook` fails in an
      environment where Storybook's toolchain can't run (see
      docs/website/package.json's "build-storybook" — it deliberately falls
      back rather than failing the whole site build), this page keeps the
      link from 404ing. A successful `storybook build` always overwrites
      this file (and populates the rest of public/storybook/, which is
      otherwise gitignored generated output) with the real static
      Storybook site.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #08090c;
        color: #f2efe9;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      a {
        color: #ff758f;
      }
      code {
        background: #131318;
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Storybook build unavailable</h1>
      <p>
        This deploy's <code>storybook build</code> step didn't complete. Run
        <code>npm run storybook</code> from <code>docs/website/</code> to browse component stories
        locally, or see
        <a href="https://github.com/ACFHarbinger/Project-Mobile-Fortress/tree/main/docs/website/stories">
          stories/
        </a>
        on GitHub.
      </p>
    </div>
  </body>
</html>
