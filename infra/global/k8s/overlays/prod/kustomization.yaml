apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: game-backend-prod
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: game-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
