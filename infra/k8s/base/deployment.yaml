apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-backend
  labels:
    app: game-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-backend
  template:
    metadata:
      labels:
        app: game-backend
    spec:
      containers:
        - name: game-backend
          image: ghcr.io/example/mobile-game-template-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: game-backend-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
