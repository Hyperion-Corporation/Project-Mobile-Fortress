apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.game-backend.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game-backend
                port:
                  number: 80
