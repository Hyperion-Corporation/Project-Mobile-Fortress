[project]
name = "mobile-fortress-docs-tooling"
version = "0.1.0"
description = "Python tooling dependencies for Mobile Fortress — MkDocs Material for local browsing of docs/mkdocs.yml's portal (docs/website is the primary, deployed documentation site; see docs/website/README.md), plus the optional git/ repo-automation suite's CI dependencies (the `ci` extra)."
requires-python = ">=3.11"
dependencies = [
    "mkdocs-material>=9.5,<10",
]

# git/scripts/'s Project-board automation (sync_backlog.py, agent_tools.py,
# check_commit_ref.py — see git/README.md) isn't installed by default; only
# .github/workflows/agent_sync.yml and contributors running those scripts
# directly need it (`uv sync --extra ci` / `pip install '.[ci]'`).
[project.optional-dependencies]
ci = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "google-genai>=0.3",
]

# This repo has no other Python application/library source — this
# pyproject.toml exists purely to pin these tooling dependencies
# reproducibly (matching the Kotlin/npm workspaces at the repo root),
# instead of ad-hoc `pip install`s. `packages = []` tells setuptools
# there's nothing to package, so `pip install .` just installs the pinned
# dependencies above (and `.[ci]` also pulls in the optional-dependencies
# group).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
