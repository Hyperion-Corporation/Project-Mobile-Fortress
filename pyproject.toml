[project]
name = "mobile-fortress-docs-tooling"
version = "0.1.0"
description = "Python tooling dependencies for Mobile Fortress — currently just MkDocs Material, for local browsing of docs/mkdocs.yml's portal (docs/website/vue is the primary, deployed documentation site; see docs/website/README.md)."
requires-python = ">=3.11"
dependencies = [
    "mkdocs-material>=9.5,<10",
]

# This repo has no Python application/library source — this pyproject.toml
# exists purely to pin the local `mkdocs serve` tooling dependency
# reproducibly (matching the Kotlin/npm workspaces at the repo root),
# instead of the ad-hoc `pip install mkdocs-material` used historically.
# `packages = []` tells setuptools there's nothing to package, so
# `pip install .` just installs the pinned dependencies above.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
